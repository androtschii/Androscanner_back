# Секреты берутся из файла .env рядом с этим docker-compose.yml.
# Синтаксис ${VAR:?текст} останавливает запуск с внятной ошибкой, если
# переменная не задана — это намеренно: молча подставленный дефолтный
# ключ подписи опаснее, чем упавший старт.
#
# Быстрый старт:
#   cp .env.example .env
#   python -c "import secrets; print(secrets.token_hex(32))"   # в JWT_SECRET
#   docker compose up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}
      POSTGRES_DB: scanner
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт нужен воркеру: он живёт в host-сети и до внутреннего DNS не достаёт.
    # Слушаем только 127.0.0.1, наружу база не торчит.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    # Только на localhost: панель управления сканером не должна
    # оказаться доступной из сети по недосмотру
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # API в обычной bridge-сети — обращается к сервисам по именам
      DATABASE_URL: postgresql+psycopg://scanner:${POSTGRES_PASSWORD}@db:5432/scanner
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?задай JWT_SECRET в .env — сгенерируй случайный}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?задай DEFAULT_ADMIN_PASSWORD в .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
      USE_CELERY: "true"
      # Пусто = уведомления и команды бота выключены — оба необязательны,
      # см. Androscanner_back/README.md «Уведомления в Telegram»
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    # Теперь /health реально проверяет БД и Redis, поэтому на него
    # можно опираться, а не только на «процесс жив»
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    # Сосед по каталогу: оба репозитория клонируются рядом друг с другом
    # (см. корневой README) — здесь так же, как api ссылается на ./backend.
    build:
      context: ../Androscanner_front
      args:
        # Адрес API вшивается в бандл на сборке (Vite), поменять после
        # уже нельзя. Для демо по локальной сети переопредели в .env на
        # LAN-адрес этой машины и открой api не только на 127.0.0.1 —
        # см. Androscanner_front/README.md.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api

  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    # host-сеть обязательна для ARP-discovery: в bridge-сети контейнер сидит
    # в своей подсети и локальную сеть на L2 не видит. Плата за это — сервисы
    # приходится звать через 127.0.0.1, а не по именам db/redis.
    network_mode: host
    environment:
      DATABASE_URL: postgresql+psycopg://scanner:${POSTGRES_PASSWORD}@127.0.0.1:5432/scanner
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: ${JWT_SECRET:?задай JWT_SECRET в .env}
      USE_CELERY: "true"
    # nmap умеет SYN-скан, ARP и определение ОС только с этими правами
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
