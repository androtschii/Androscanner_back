name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    # Тесты гоняются на ОБЕИХ базах. Локально разработка идёт на SQLite,
    # а в проде PostgreSQL — расхождения между ними должны всплывать здесь,
    # а не в бою. Именно так был найден баг с часовыми поясами: SQLite
    # терял зону, PostgreSQL — нет.
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: sqlite
            url: sqlite+pysqlite:///./test.db
          - name: postgres
            url: postgresql+psycopg://scanner:scanner@localhost:5432/scanner

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scanner
          POSTGRES_PASSWORD: scanner
          POSTGRES_DB: scanner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scanner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # nmap нужен тестам движка: они проверяют, что он находится.
      # Pango и шрифт — тестам PDF-отчётов. Сама сеть не сканируется.
      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nmap libpango-1.0-0 libpangoft2-1.0-0 libcairo2 fonts-dejavu-core

      - name: Python-зависимости
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Тесты на ${{ matrix.database.name }}
        working-directory: backend
        env:
          TEST_DATABASE_URL: ${{ matrix.database.url }}
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compose-файл ни разу не проверялся: Docker не был установлен
      # на машине разработки. Пусть хотя бы синтаксис и сборка образа
      # ломаются здесь, а не при первом развёртывании.
      - name: Проверка docker-compose
        env:
          JWT_SECRET: ci-only-not-a-real-secret
          POSTGRES_PASSWORD: ci-only
          DEFAULT_ADMIN_PASSWORD: ci-only-password
        run: docker compose config --quiet

      - name: Сборка образа
        run: docker build -t androscanner-backend ./backend

      - name: nmap внутри образа
        run: docker run --rm androscanner-backend nmap --version

      - name: WeasyPrint внутри образа
        run: |
          docker run --rm androscanner-backend \
            python -c "import weasyprint; print('WeasyPrint', weasyprint.__version__)"
